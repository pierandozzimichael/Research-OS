name: Labmate release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Install locked dependencies for the indexer
        run: pnpm install --frozen-lockfile
      - name: Build safe demo archive
        shell: pwsh
        run: ./scripts/package-lab-release.ps1 -ArchiveFormat all
      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-os-lab-release
          path: dist/releases/research-os-lab-*
      - name: Attach tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/releases/research-os-lab-*
          generate_release_notes: true
